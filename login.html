<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In — Al-Estekama School</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="brand">
      <div class="ico">ع</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your school account</p>
    </div>

    <div id="err" class="alert alert-red"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" maxlength="120" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" maxlength="100" autocomplete="current-password">
    </div>

    <button class="btn btn-green btn-full" id="btn-login">Sign In</button>

    <div class="auth-switch">No account yet? <a href="register.html">Register here</a></div>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { isValidEmail, fieldError, clearAllErrors, autoClear, renderNavbar } from "./helpers.js";
  renderNavbar({ variant: "auth" });
  import { signInWithEmailAndPassword, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, getDoc }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const $email = document.getElementById("email");
  const $pass  = document.getElementById("password");
  autoClear($email, $pass);

  // If already logged in, redirect based on role
  onAuthStateChanged(auth, async user => {
    if (!user) return;
    const snap = await getDoc(doc(db, "users", user.uid));
    const role = snap.exists() ? snap.data().role : "user";
    window.location.href = role === "admin" ? "admin/index.html" : "departments.html";
  });

  // this will show a red error banner with your message
  function showErr(msg) {
    const el = document.getElementById("err");
    el.textContent = msg;
    el.classList.add("show");
  }

  // this will use your email + password to sign you in and send you to your area
  async function doLogin() {
    document.getElementById("err").classList.remove("show");
    clearAllErrors();
    const email    = $email.value.trim();
    const password = $pass.value;

    let ok = true;
    if (!email)                     ok = fieldError($email, "Please enter your email.");
    else if (!isValidEmail(email))  ok = fieldError($email, "Please enter a valid email address.");
    if (!password)                  ok = fieldError($pass, "Please enter your password.");
    if (!ok) return;

    const btn = document.getElementById("btn-login");
    btn.textContent = "Signing in…";
    btn.disabled = true;

    try {
      const result = await signInWithEmailAndPassword(auth, email, password);

      // Read role and redirect
      const snap = await getDoc(doc(db, "users", result.user.uid));
      const role = snap.exists() ? snap.data().role : "user";
      window.location.href = role === "admin" ? "admin/index.html" : "departments.html";

    } catch (error) {
      btn.textContent = "Sign In";
      btn.disabled = false;

      const messages = {
        "auth/user-not-found":     "No account found with this email.",
        "auth/wrong-password":     "Wrong password. Please try again.",
        "auth/invalid-email":      "Please enter a valid email address.",
        "auth/too-many-requests":  "Too many failed attempts. Please wait a moment.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/network-request-failed": "Network error. Check your internet connection."
      };
      showErr(messages[error.code] || "Sign in failed: " + error.message);
    }
  }

  document.getElementById("btn-login").addEventListener("click", doLogin);
  // Also allow pressing Enter in password field
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
</script>
</body>
</html>
